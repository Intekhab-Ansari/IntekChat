<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad-cyan-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark Obsidian Background -->
  <rect width="64" height="64" rx="16" fill="#070a14" />
  <rect width="64" height="64" rx="16" stroke="url(#grad-cyan-pink)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Infinity Quantum Waves & iC Monogram -->
  <g filter="url(#neon-glow)" transform="translate(6, 6) scale(0.8125)">
    <!-- Infinity loop track -->
    <path d="M 20 32 C 8 32, 8 16, 20 16 C 32 16, 32 48, 44 48 C 56 48, 56 32, 44 32 C 32 32, 32 16, 20 16" 
          stroke="url(#grad-cyan-pink)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Quantum Signal Wave -->
    <path d="M 12 32 Q 22 18, 32 32 T 52 32" 
          stroke="#00f2fe" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.9" />

    <!-- Futuristic i-dot -->
    <circle cx="20" cy="8" r="3.5" fill="#00f2fe" />
    <!-- Center data node -->
    <circle cx="32" cy="32" r="2.5" fill="#ff0080" />
  </g>
</svg>
